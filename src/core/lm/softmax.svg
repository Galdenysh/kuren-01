<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="auto" role="img" aria-label="Softmax: три оценки становятся вероятностями с суммой 1">
  <title>Softmax строки оценок 1, 2, 3</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="640" height="360" rx="12" fill="#f8fafc"/>
  <text x="28" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Оценки</text>
  <text x="360" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Вероятности</text>
  <text x="28" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">до softmax</text>
  <text x="360" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">после softmax, сумма 1</text>
  <line x1="70" y1="280" x2="250" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="88" y="200" width="36" height="80" rx="4" fill="#e2e8f0"/>
  <rect x="146" y="120" width="36" height="160" rx="4" fill="#cbd5e1"/>
  <rect x="204" y="40" width="36" height="240" rx="4" fill="#94a3b8"/>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#334155" text-anchor="middle">
    <text x="106" y="302">1</text>
    <text x="164" y="302">2</text>
    <text x="222" y="302">3</text>
  </g>
  <line x1="300" y1="180" x2="340" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="280" x2="600" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="400" y1="80" x2="600" y2="80" stroke="#dcfce7" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="392" y="84" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#16a34a">1</text>
  <rect x="428" y="262" width="36" height="18" rx="4" fill="#bbf7d0"/>
  <rect x="486" y="231" width="36" height="49" rx="4" fill="#86efac"/>
  <rect x="544" y="147" width="36" height="133" rx="4" fill="#16a34a"/>
  <g font-family="system-ui, sans-serif" font-size="12" fill="#334155" text-anchor="middle">
    <text x="446" y="254">0.09</text>
    <text x="504" y="223">0.24</text>
    <text x="562" y="139" fill="#15803d">0.67</text>
    <text x="446" y="302">класс 0</text>
    <text x="504" y="302">класс 1</text>
    <text x="562" y="302">класс 2</text>
  </g>
  <text x="500" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">0.09 + 0.24 + 0.67 = 1</text>
</svg>
