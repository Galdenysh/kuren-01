<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="100%" height="auto" role="img" aria-label="Шаг обучения: датасет, прямой проход, ошибка, обратный проход, обновление, снимок, лаборатория">
  <title>Поток шага обучения и снимка для лаборатории</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="880" height="300" rx="12" fill="#f8fafc"/>

  <text x="28" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Шаг обучения</text>
  <text x="148" y="32" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">четыре строки XOR, затем один снимок</text>

  <rect x="24" y="52" width="132" height="64" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="90" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#0369a1">Датасет</text>
  <text x="90" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0369a1">4 строки XOR</text>

  <line x1="156" y1="84" x2="184" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="188" y="52" width="148" height="64" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="262" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Прямой проход</text>
  <text x="262" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6d28d9">четыре предсказания</text>

  <line x1="336" y1="84" x2="364" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="368" y="52" width="112" height="64" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
  <text x="424" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45309">Ошибка</text>
  <text x="424" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#b45309">одно число L</text>

  <line x1="480" y1="84" x2="508" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="512" y="52" width="168" height="64" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="596" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Обратный проход</text>
  <text x="596" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6d28d9">девять наклонов</text>

  <line x1="680" y1="84" x2="708" y2="84" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="712" y="52" width="144" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="784" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">Обновление</text>
  <text x="784" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">веса и смещения</text>

  <path d="M424,116 L424,148 L330,148 L330,168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M784,116 L784,148 L470,148 L470,168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="250" y="172" width="220" height="64" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Снимок</text>
  <text x="360" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#475569">ошибка, веса, активации</text>

  <line x1="470" y1="204" x2="528" y2="204" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="532" y="172" width="160" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="612" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">Лаборатория</text>
  <text x="612" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">только рисует</text>

  <path d="M262,116 L262,168" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-soft)"/>
  <text x="28" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#b45309">Пунктир: снимок для графа. Только прямой проход, веса не меняются.</text>
</svg>
