<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="auto" role="img" aria-label="MLP 2-2-1: weights W1, W2 and biases">
  <title>MLP 2 to 2 to 1</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-bias" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#d97706"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="860" height="480" rx="12" fill="#f8fafc"/>

  <text x="140" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Входной слой (2)</text>
  <text x="420" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Скрытый слой (2)</text>
  <text x="700" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Выходной слой (1)</text>

  <!-- W1 -->
  <line x1="176" y1="160" x2="378" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="236" y="136" width="72" height="20" rx="4" fill="#f8fafc"/>
  <text x="272" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">W₁[0, 0]</text>

  <line x1="172" y1="176" x2="384" y2="304" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214" y="214" width="72" height="20" rx="4" fill="#f8fafc"/>
  <text x="250" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">W₁[0, 1]</text>

  <line x1="172" y1="304" x2="384" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="214" y="256" width="72" height="20" rx="4" fill="#f8fafc"/>
  <text x="250" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">W₁[1, 0]</text>

  <line x1="176" y1="320" x2="378" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="236" y="326" width="72" height="20" rx="4" fill="#f8fafc"/>
  <text x="272" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">W₁[1, 1]</text>

  <!-- W2 -->
  <line x1="462" y1="172" x2="658" y2="228" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="519" y="176" width="78" height="20" rx="4" fill="#f8fafc"/>
  <text x="558" y="190" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">W₂[0, 0]</text>

  <line x1="462" y1="308" x2="658" y2="252" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="519" y="284" width="78" height="20" rx="4" fill="#f8fafc"/>
  <text x="558" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">W₂[1, 0]</text>

  <!-- biases -->
  <line x1="420" y1="86" x2="420" y2="118" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-bias)"/>
  <rect x="382" y="60" width="76" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">b₁[0, 0]</text>

  <line x1="420" y1="394" x2="420" y2="362" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-bias)"/>
  <rect x="382" y="396" width="76" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="411" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">b₁[0, 1]</text>

  <line x1="700" y1="164" x2="700" y2="198" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-bias)"/>
  <rect x="662" y="138" width="76" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="700" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">b₂[0, 0]</text>

  <!-- neurons: short name inside, formula under the circle so it is not clipped -->
  <circle cx="140" cy="160" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="140" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0369a1">x₀</text>

  <circle cx="140" cy="320" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="140" y="326" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0369a1">x₁</text>

  <circle cx="420" cy="160" r="40" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="420" y="156" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">h₀</text>
  <text x="420" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6d28d9">σ(z₀)</text>

  <circle cx="420" cy="320" r="40" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="420" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#5b21b6">h₁</text>
  <text x="420" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6d28d9">σ(z₁)</text>

  <circle cx="700" cy="240" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="700" y="236" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">ŷ</text>
  <text x="700" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#166534">σ(z₂)</text>

  <line x1="742" y1="240" x2="800" y2="240" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow-out)"/>
  <text x="828" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">ŷ</text>

  <text x="430" y="452" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">z₀ = x₀·W₁[0,0] + x₁·W₁[1,0] + b₁[0,0]</text>
  <text x="430" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">z₁ = x₀·W₁[0,1] + x₁·W₁[1,1] + b₁[0,1]    ·    z₂ = h₀·W₂[0,0] + h₁·W₂[1,0] + b₂[0,0]</text>
</svg>
