schema: spec-driven

context: |
  Root AGENTS.md is an index. Read the nested AGENTS.md for the area you touch
  (openspec/, src/core/, src/ui/, .cursor/). Do not copy those files into artifacts.
  Next implementation change: xor-training-lab.

rules:
  proposal:
    - Always state what is out of scope
    - Keep proposals under 500 words
    - Do not start a new change for a typo, lint, or a bug already specified; offer a fork first
  design:
    - Record the core vs ui boundary if the change touches both
  tasks:
    - One ## section of tasks.md is one review stop unless the user asked to run the whole plan
    - 'Core work is test-first: a failing test task before the implementation task'
    - UI tasks come after core tests are specified as green
    - Every task must say how to verify it
    - 'End with a done-gate group: test, lint, build, and browser if UI changed'
    - Do not include a transformer, language model, or agent loop in xor-training-lab

operations:
  apply:
    guidance:
      - Do not write src/core production code before a failing test for that behavior
      - Do not start src/ui until core tests for this change are green
      - src/core must not import react or src/ui
      - Do not claim done until npm run verify passes
      - If UI changed, ask the user to start Dev via Run Task, then verify in the browser. Do not start the server unless they asked
      - Do not start vite, npm run dev, or other long-running servers unless the user explicitly asked in this message
      - Do not execute tasks.md or write slice code until the user has reviewed proposal.md and design.md in this conversation
      - After finishing a ## section in tasks.md, stop for code review unless the user asked to run the whole plan
      - Implement only the current OpenSpec change
  archive:
    guidance:
      - Summarize what the next agent should pick up
